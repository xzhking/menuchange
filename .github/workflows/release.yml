name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: |
          node test/manifest-utils.test.js
          node test/nls.test.js

      - name: Check extension entry point syntax
        run: node --check extension.js

      - name: Package VSIX
        run: node tools/package-vsix.js

      - name: Upload VSIX as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix

      - name: Attach VSIX to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
